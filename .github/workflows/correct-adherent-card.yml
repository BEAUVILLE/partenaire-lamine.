name: Corriger carte Lamine adhérent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Corriger la carte et le wording
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          p=Path('carte-visite.png')
          im=Image.open(p).convert('RGB')
          W,H=im.size
          sx,sy=W/1559,H/1009
          s=min(sx,sy)
          d=ImageDraw.Draw(im)
          bg=(4,32,21); gold=(235,191,78)
          rect=(round(340*sx),round(165*sy),round(950*sx),round(242*sy))
          d.rounded_rectangle(rect,radius=max(8,round(20*s)),fill=bg,outline=gold,width=max(1,round(2*s)))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',max(14,round(34*s)))
          txt='ADHÉRENT DIGIYLYFE'; bb=d.textbbox((0,0),txt,font=font)
          d.text(((rect[0]+rect[2]-(bb[2]-bb[0]))/2,round(185*sy)),txt,font=font,fill=gold)
          im.save(p,optimize=True)

          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          repl={
            '👑 Chauffeur partenaire':'ADHÉRENT DIGIYLYFE',
            '🧾 QR officiel':'🔳 QR DIGIYLYFE',
            'Fiche officielle :':'Fiche DIGIYLYFE :',
            'QR officiel DIGIYLYFE':'QR DIGIYLYFE',
            'official DIGIYLYFE QR':'DIGIYLYFE QR',
            'Official DIGIYLYFE QR':'DIGIYLYFE QR'
          }
          for a,b in repl.items(): text=text.replace(a,b)
          idx.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add carte-visite.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carte Lamine : adhérent DIGIYLYFE"
          git push
