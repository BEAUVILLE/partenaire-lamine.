name: Doctrine adhérent Lamine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finir le nettoyage adhérent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          repl={
            '👑 Chauffeur partenaire':'👤 ADHÉRENT DIGIYLYFE',
            'Fiche%20officielle%20%3A':'Fiche%20DIGIYLYFE%20%3A',
            'profils de chauffeurs partenaires':'profils de chauffeurs adhérents',
            'Chauffeur ambassadeur DIGIY DRIVER':'Chauffeur · adhérent DIGIYLYFE'
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          echo '=== Restes sensibles hors URL de domaine ==='
          grep -inoE 'officiel|officielle|ambassadeur|sélectionné|certifi|garanti|chauffeur partenaire' index.html | head -80 || true
      - name: Commit index seulement
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Lamine : terminer le wording adhérent DIGIYLYFE' || exit 0
          git push
