name: Optimiser media Lamine chauffeur

on:
  push:
    paths:
      - '.github/workflows/optimiser-media-lamine-temp.yml'

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer convertisseurs
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin

      - name: Convertir la carte Lamine
        run: |
          set -euo pipefail
          cwebp -quiet -q 82 carte-visite.png -o carte-visite.webp
          avifenc --min 28 --max 35 --speed 6 carte-visite.png carte-visite.avif >/dev/null

      - name: Basculer affichage vers formats legers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="cardframe"><a href="https://partenaire-lamine.digiylyfe.com/" target="_blank" rel="noopener"><img src="/carte-visite.png?v=20260828-doctrine-maitre" alt="Carte de visite DIGIY DRIVER de Lamine" loading="eager"></a></div>'
          new='''<div class="cardframe"><a href="https://partenaire-lamine.digiylyfe.com/" target="_blank" rel="noopener"><picture class="digiy-card-picture"><source type="image/avif" srcset="/carte-visite.avif"><source type="image/webp" srcset="/carte-visite.webp"><img src="/carte-visite.png?v=20260828-doctrine-maitre" alt="Carte de visite DIGIY DRIVER de Lamine" loading="lazy" decoding="async"></picture></a></div>'''
          if old not in s:
              raise SystemExit('Carte affichee Lamine introuvable')
          s=s.replace(old,new,1)

          marker='/* DIGIY media opt Lamine 20260830 */'
          if marker not in s:
              css='''\n/* DIGIY media opt Lamine 20260830 */\n.cardframe picture.digiy-card-picture{display:block;width:100%}\n.cardframe picture.digiy-card-picture img{display:block;width:100%;height:auto;border-radius:18px;background:#fff}\n'''
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Controler le gain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          png=Path('carte-visite.png')
          webp=Path('carte-visite.webp')
          avif=Path('carte-visite.avif')
          print(f'carte original={png.stat().st_size} webp={webp.stat().st_size} avif={avif.stat().st_size}')
          PY

      - name: Publier optimisation
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html carte-visite.webp carte-visite.avif
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: optimiser Lamine chauffeur en AVIF et WebP'
          git push
